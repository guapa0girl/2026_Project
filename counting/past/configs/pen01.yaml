# Example pen config, seeded with the calibrated values from the 1-minute
# sample-video pilot (ObjectDetectionTracking_GPU/aggregate_feeding.py).
# Copy this file per pen/camera (e.g. pen02.yaml for a different growth stage)
# and re-run scripts/calibrate_feeder.py against that pen's own footage --
# feeder position/size and lighting will differ per camera.

pen_id: pen01
growth_stage: 이유자돈   # 이유자돈 | 육성돈 | 비육돈 -- used only for labeling/grouping plots
expected_pig_count: 10   # sanity check only, not enforced

model:
  # YOLOv8m-pose, 200 epochs, from ../results/m/ (auto_labeling_model project's
  # n/s/m/l size sweep) -- best pose mAP50-95 of the four sizes. imgsz must
  # match training (640), not the other checkpoints' 960. See models/README.md
  # for the other checkpoint lineages this project has accumulated.
  weights: models/pig_pose_m_best.pt
  imgsz: 640
  conf: 0.4
  iou: 0.5
  tracker: bytetrack.yaml
  device: null          # null = auto-select GPU, else "0" or "cpu"
  n_keypoints: 18

# Circular feeder ROI in pixel coordinates. Regenerate with:
#   python scripts/calibrate_feeder.py --source data/raw/<video>.mp4 --at-sec 15
feeder:
  cx: 454.0
  cy: 354.0
  r: 169.0
  ring_inner_ratio: 0.20   # excludes the lid center a nose can't reach
  ring_outer_ratio: 1.10   # margin for a nose resting on the rim

feeding_rule:
  nose_index: 12    # "nose" -- ordered by CVAT svg node-id (creation order), not sublabels display order
  neck_index: 11    # "neck"
  direction_angle_max_deg: 60.0
  keypoint_conf_min: 0.5
  min_bout_sec: 0.0   # >0 requires this many consecutive seconds of "feeding" before it counts (filters flicker)

aggregation:
  smooth_sec: 1.0     # centered/trailing moving average over raw per-frame counts
  bin_size: 5s         # "5s" for a short test clip; "1min" or "1h" for a full-day recording
  video_start_time: null   # e.g. "2026-08-19T09:00:00" -- enables a time-of-day x-axis on the plot

notes: "1분 샘플 영상 파일럿 값으로 시딩됨. 실제 돈방 영상에 맞게 calibrate_feeder.py로 재측정할 것."
