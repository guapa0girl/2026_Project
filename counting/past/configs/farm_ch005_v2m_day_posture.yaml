# Real farm footage: data/raw/[CH005] 202606100923_44.avi (day)
# Same camera/feeder as configs/farm_ch005_20260610.yaml, but using the
# models_v2/results/m checkpoint (separate n/s/m/l sweep from
# auto_labeling_model, trained on configs/_pig_pose.resolved.yaml -- same
# 18-keypoint node-id order as models/pig_pose_m_best.pt, so KEYPOINT_NAMES
# in pose_tracker.py still applies unchanged). m had the best pose
# mAP50-95 of this sweep too (0.514 vs n=0.408/s=0.469/l=0.495).
#
# Same AVI header caveat as farm_ch005_20260610.yaml: fps=200 confirmed
# real by the user (matches filename-encoded/expected duration), but
# seeking can still fail sporadically -- see that config's notes.

pen_id: farm_ch005
growth_stage: 육성돈   # TODO confirm actual growth stage for this pen
expected_pig_count: 8

model:
  weights: models/pig_pose_v2_m_best.pt
  imgsz: 640
  conf: 0.4
  iou: 0.5
  tracker: bytetrack.yaml
  device: null
  n_keypoints: 18

feeder:
  cx: 908.9
  cy: 530.8
  r: 337.3
  ring_inner_ratio: 0.20
  ring_outer_ratio: 0.70

feeding_rule:
  nose_index: 12
  neck_index: 11
  direction_angle_max_deg: 60.0
  keypoint_conf_min: 0.5
  min_bout_sec: 0.0
  posture_enabled: true
  # Calibrated 2026-08-25 from 34 human-labeled detections at night (same
  # physical feeder/camera -- see farm_ch005_v2m_night_posture.yaml for the
  # labeling detail); not separately verified against day footage yet.
  posture_aspect_low: 0.15
  posture_aspect_high: 0.33
  posture_asym_low: 0.001
  posture_asym_high: 0.01
  posture_weights: [0.0, 0.75, 0.25]   # (limb, aspect, asymmetry)
  posture_score_max: 0.5
  posture_min_evidence: 0.5

aggregation:
  smooth_sec: 1.0
  bin_size: 1min
  video_start_time: "2026-06-10T09:23:00"   # from filename; confirm against actual DVR metadata if available

notes: "실제 농장 영상(2026-06-10, 낮). models_v2 m 체크포인트 사용. fps=200 확인됨."
