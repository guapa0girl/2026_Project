# ablation 'dir60': direction=60deg (on), posture=off
# SAMPLE: 1-minute sample video (960x720, no CH in filename), Stage 1 labels: CVAT task 000, 86 imgs / 1 clip.
# Feeder circle: calibrate_feeder.py on 000/img/frame_000.jpg.
#
# Same label definition and rule as farm_ch010.yaml (ring inner 0.0 / outer 1.0 = whole lid,
# direction 60 deg, posture off). Used by evaluate_methods.py via eval_cameras.yaml.

pen_id: farm_sample
growth_stage: TODO
expected_pig_count: 10  # sanity check only

model:
  weights: models/pig_pose_best.pt # YOLOv8-pose trained on 001+002 (CH005+CH010, 190 imgs); copy the chosen size's best.pt here
  imgsz: 640
  conf: 0.4
  iou: 0.5
  tracker: bytetrack.yaml
  device: null # Windows(CUDA): null -> GPU 자동 선택
  # device: mps        # Mac에서 돌릴 때는 위 줄을 주석 처리하고 이 줄 주석 해제 (null이면 Mac은 CPU로 떨어져 매우 느림)
  n_keypoints: 18

feeder:
  cx: 453.4
  cy: 354.3
  r: 169.2
  ring_inner_ratio: 0.0
  ring_outer_ratio: 1.0

feeding_rule:
  nose_index: 12
  neck_index: 11
  direction_angle_max_deg: 60.0
  keypoint_conf_min: 0.5
  min_bout_sec: 0.0
  posture_enabled: false

aggregation:
  smooth_sec: 1.0
  bin_size: 10min

notes: "1분 샘플 영상(960x720), Stage 1 라벨(000) 기준. ROI=빨간 사료통 전체."
