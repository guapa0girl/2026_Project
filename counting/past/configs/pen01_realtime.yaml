# Same as pen01.yaml, tuned for scripts/run_realtime.py: aggregation.bin_size
# is 1s, so one aggregator bin closes -- and one "Count : N" line is printed/
# logged -- every second, per the live-monitoring request (on-screen overlay +
# per-second terminal output + a continuously-appended live_log.txt used by
# scripts/plot_live_log.py to find the peak feeding hour).
#
# Copy this per pen/camera and re-run scripts/calibrate_feeder.py against
# that pen's own footage first -- feeder position/size will differ.

pen_id: pen01
growth_stage: 이유자돈   # 이유자돈 | 육성돈 | 비육돈 -- used only for labeling/grouping plots
expected_pig_count: 10   # sanity check only, not enforced

model:
  weights: models/pig_pose_m_best.pt   # YOLOv8m-pose, 200 epochs -- see models/README.md
  imgsz: 640
  conf: 0.4
  iou: 0.5
  tracker: bytetrack.yaml
  device: null          # null = auto-select GPU, else "0" or "cpu"
  n_keypoints: 18

# Circular feeder ROI in pixel coordinates. Regenerate with:
#   python scripts/calibrate_feeder.py --source data/raw/<video>.mp4 --at-sec 15
feeder:
  cx: 454.0
  cy: 354.0
  r: 169.0
  ring_inner_ratio: 0.20
  ring_outer_ratio: 1.10

feeding_rule:
  nose_index: 12    # "nose" -- ordered by CVAT svg node-id (creation order), not sublabels display order
  neck_index: 11    # "neck"
  direction_angle_max_deg: 60.0
  keypoint_conf_min: 0.5
  min_bout_sec: 0.0

aggregation:
  smooth_sec: 1.0    # average over the last ~1s of raw per-frame counts before each per-second log line
  bin_size: 1s        # <-- one log line per second, per the live-monitoring request
  video_start_time: null   # run_realtime.py fills this in with the actual run start time automatically

notes: "실시간(RTSP/웹캠) 모니터링용: 초당 1줄 Count 로그 -> plot_live_log.py로 시간대별 패턴 확인."
